<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建客户 - eDOC 管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        dark: '#1e293b',
                        light: '#f8fafc'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .sidebar-active {
                @apply bg-primary text-white;
            }
            .sidebar-item {
                @apply flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 hover:bg-gray-100 dark:hover:bg-gray-700;
            }
            .sidebar-item.active {
                @apply bg-primary text-white;
            }
            .card {
                @apply bg-white dark:bg-gray-800 rounded-lg shadow-md p-4 transition-all duration-300 hover:shadow-lg;
            }
            .btn {
                @apply px-4 py-2 rounded-lg font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2;
            }
            .btn-primary {
                @apply bg-primary text-white hover:bg-primary/90 focus:ring-primary;
            }
            .btn-secondary {
                @apply bg-gray-200 text-gray-800 dark:bg-gray-700 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600 focus:ring-gray-400;
            }
            .btn-success {
                @apply bg-success text-white hover:bg-success/90 focus:ring-success;
            }
            .btn-warning {
                @apply bg-warning text-white hover:bg-warning/90 focus:ring-warning;
            }
            .btn-danger {
                @apply bg-danger text-white hover:bg-danger/90 focus:ring-danger;
            }
            .input {
                @apply w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent;
            }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">
    <!-- 顶部导航栏 -->
    <header class="bg-white dark:bg-gray-800 shadow-sm z-10">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <button id="sidebar-toggle" class="text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 focus:outline-none lg:hidden">
                    <i class="fa fa-bars text-xl"></i>
                </button>
                <h1 class="text-xl font-bold text-primary">eDOC 管理系统</h1>
            </div>
            <div class="flex items-center gap-4">
                <div class="relative">
                    <input type="text" placeholder="搜索..." class="input pl-10 pr-4 py-2 text-sm w-64">
                    <i class="fa fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                </div>
                <div class="flex items-center gap-3">
                    <button class="text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 focus:outline-none relative">
                        <i class="fa fa-bell text-xl"></i>
                        <span class="absolute top-0 right-0 w-2 h-2 bg-danger rounded-full"></span>
                    </button>
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white">
                            <i class="fa fa-user"></i>
                        </div>
                        <span class="hidden md:inline">管理员</span>
                        <i class="fa fa-chevron-down text-xs text-gray-500 dark:text-gray-400"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <div class="flex flex-1 overflow-hidden">
        <!-- 侧边栏 -->
        <aside id="sidebar" class="w-64 bg-white dark:bg-gray-800 shadow-md transform -translate-x-full lg:translate-x-0 fixed lg:relative top-0 left-0 h-full z-20 transition-transform duration-300 ease-in-out">
            <div class="p-4 h-full flex flex-col">
                <div class="flex items-center gap-2 mb-8">
                    <div class="w-10 h-10 rounded-lg bg-primary flex items-center justify-center text-white">
                        <i class="fa fa-file-text-o text-xl"></i>
                    </div>
                    <h2 class="text-lg font-semibold">eDOC</h2>
                </div>
                <nav class="flex-1 space-y-1">
                    <a href="../index.html" class="sidebar-item">
                        <i class="fa fa-dashboard w-5 text-center"></i>
                        <span>管理概览</span>
                    </a>
                    <div class="space-y-1">
                        <button class="sidebar-item justify-between">
                            <div class="flex items-center gap-3">
                                <i class="fa fa-folder-open w-5 text-center"></i>
                                <span>文档管理</span>
                            </div>
                            <i class="fa fa-chevron-down text-xs"></i>
                        </button>
                        <div class="pl-8 space-y-1 hidden">
                            <a href="../documents/list.html" class="sidebar-item text-sm">
                                <span>文档列表</span>
                            </a>
                            <a href="../documents/add.html" class="sidebar-item text-sm">
                                <span>文档补录</span>
                            </a>
                            <a href="../documents/audit.html" class="sidebar-item text-sm">
                                <span>文档审核</span>
                            </a>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <button class="sidebar-item justify-between active">
                            <div class="flex items-center gap-3">
                                <i class="fa fa-users w-5 text-center"></i>
                                <span>客户管理</span>
                            </div>
                            <i class="fa fa-chevron-down text-xs rotate-180"></i>
                        </button>
                        <div class="pl-8 space-y-1">
                            <a href="list.html" class="sidebar-item text-sm">
                                <span>客户列表</span>
                            </a>
                            <a href="add.html" class="sidebar-item text-sm active">
                                <span>新建客户</span>
                            </a>
                            <a href="logs.html" class="sidebar-item text-sm">
                                <span>客户操作日志</span>
                            </a>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <button class="sidebar-item justify-between">
                            <div class="flex items-center gap-3">
                                <i class="fa fa-plug w-5 text-center"></i>
                                <span>系统对接</span>
                            </div>
                            <i class="fa fa-chevron-down text-xs"></i>
                        </button>
                        <div class="pl-8 space-y-1 hidden">
                            <a href="../system/configuration.html" class="sidebar-item text-sm">
                                <span>对接系统配置</span>
                            </a>
                            <a href="../system/tasks.html" class="sidebar-item text-sm">
                                <span>同步任务管理</span>
                            </a>
                            <a href="../system/logs.html" class="sidebar-item text-sm">
                                <span>接口日志监控</span>
                            </a>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <button class="sidebar-item justify-between">
                            <div class="flex items-center gap-3">
                                <i class="fa fa-bar-chart w-5 text-center"></i>
                                <span>统计分析</span>
                            </div>
                            <i class="fa fa-chevron-down text-xs"></i>
                        </button>
                        <div class="pl-8 space-y-1 hidden">
                            <a href="../analytics/dashboard.html" class="sidebar-item text-sm">
                                <span>数据看板</span>
                            </a>
                            <a href="../analytics/reports.html" class="sidebar-item text-sm">
                                <span>报表中心</span>
                            </a>
                            <a href="../analytics/hotspots.html" class="sidebar-item text-sm">
                                <span>检索热点分析</span>
                            </a>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <button class="sidebar-item justify-between">
                            <div class="flex items-center gap-3">
                                <i class="fa fa-lock w-5 text-center"></i>
                                <span>权限管理</span>
                            </div>
                            <i class="fa fa-chevron-down text-xs"></i>
                        </button>
                        <div class="pl-8 space-y-1 hidden">
                            <a href="../permissions/roles.html" class="sidebar-item text-sm">
                                <span>角色管理</span>
                            </a>
                            <a href="../permissions/users.html" class="sidebar-item text-sm">
                                <span>用户管理</span>
                            </a>
                            <a href="../permissions/logs.html" class="sidebar-item text-sm">
                                <span>操作日志</span>
                            </a>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <button class="sidebar-item justify-between">
                            <div class="flex items-center gap-3">
                                <i class="fa fa-cog w-5 text-center"></i>
                                <span>系统设置</span>
                            </div>
                            <i class="fa fa-chevron-down text-xs"></i>
                        </button>
                        <div class="pl-8 space-y-1 hidden">
                            <a href="../settings/basic.html" class="sidebar-item text-sm">
                                <span>基础配置</span>
                            </a>
                            <a href="../settings/dictionary.html" class="sidebar-item text-sm">
                                <span>字典管理</span>
                            </a>
                        </div>
                    </div>
                </nav>
                <div class="mt-auto pt-4 border-t border-gray-200 dark:border-gray-700">
                    <a href="#" class="sidebar-item">
                        <i class="fa fa-question-circle w-5 text-center"></i>
                        <span>帮助中心</span>
                    </a>
                    <a href="#" class="sidebar-item">
                        <i class="fa fa-sign-out w-5 text-center"></i>
                        <span>退出登录</span>
                    </a>
                </div>
            </div>
        </aside>

        <!-- 遮罩层 -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-10 lg:hidden hidden"></div>

        <!-- 内容区 -->
        <main class="flex-1 overflow-y-auto p-4 lg:p-6">
            <div class="container mx-auto">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold">新建客户</h2>
                    <div class="flex items-center gap-3">
                        <a href="list.html" class="btn btn-secondary">
                            <i class="fa fa-arrow-left mr-2"></i>返回列表
                        </a>
                    </div>
                </div>
                
                <!-- 表单 -->
                <div class="card">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <h3 class="text-lg font-semibold mb-4">客户信息</h3>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">客户名称 <span class="text-danger">*</span></label>
                                    <input type="text" class="input" placeholder="请输入客户名称">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">联系人 <span class="text-danger">*</span></label>
                                    <input type="text" class="input" placeholder="请输入联系人">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">电话 <span class="text-danger">*</span></label>
                                    <input type="text" class="input" placeholder="请输入电话">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">邮箱 <span class="text-danger">*</span></label>
                                    <input type="email" class="input" placeholder="请输入邮箱">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">行业 <span class="text-danger">*</span></label>
                                    <select class="input">
                                        <option value="">请选择行业</option>
                                        <option value="金融">金融</option>
                                        <option value="制造">制造</option>
                                        <option value="科技">科技</option>
                                        <option value="其他">其他</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">状态 <span class="text-danger">*</span></label>
                                    <select class="input">
                                        <option value="活跃">活跃</option>
                                        <option value="非活跃">非活跃</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div>
                            <h3 class="text-lg font-semibold mb-4">其他信息</h3>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">地址</label>
                                    <input type="text" class="input" placeholder="请输入地址">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">注册时间</label>
                                    <input type="date" class="input">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">备注</label>
                                    <textarea class="input h-24" placeholder="请输入备注信息"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 权限配置 -->
                    <div class="mt-8">
                        <h3 class="text-lg font-semibold mb-4">权限配置</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">角色</label>
                                <select class="input">
                                    <option value="viewer">查看者</option>
                                    <option value="editor">编辑</option>
                                    <option value="admin">管理员</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">权限设置</label>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    <div class="flex items-center">
                                        <input type="checkbox" id="perm1" class="rounded border-gray-300 text-primary focus:ring-primary" checked>
                                        <label for="perm1" class="ml-2 text-sm text-gray-700 dark:text-gray-300">查看文档</label>
                                    </div>
                                    <div class="flex items-center">
                                        <input type="checkbox" id="perm2" class="rounded border-gray-300 text-primary focus:ring-primary" checked>
                                        <label for="perm2" class="ml-2 text-sm text-gray-700 dark:text-gray-300">上传文档</label>
                                    </div>
                                    <div class="flex items-center">
                                        <input type="checkbox" id="perm3" class="rounded border-gray-300 text-primary focus:ring-primary">
                                        <label for="perm3" class="ml-2 text-sm text-gray-700 dark:text-gray-300">编辑文档</label>
                                    </div>
                                    <div class="flex items-center">
                                        <input type="checkbox" id="perm4" class="rounded border-gray-300 text-primary focus:ring-primary">
                                        <label for="perm4" class="ml-2 text-sm text-gray-700 dark:text-gray-300">删除文档</label>
                                    </div>
                                    <div class="flex items-center">
                                        <input type="checkbox" id="perm5" class="rounded border-gray-300 text-primary focus:ring-primary">
                                        <label for="perm5" class="ml-2 text-sm text-gray-700 dark:text-gray-300">审核文档</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-end gap-3 mt-8">
                        <button class="btn btn-secondary">
                            <i class="fa fa-times mr-2"></i>取消
                        </button>
                        <button class="btn btn-primary">
                            <i class="fa fa-save mr-2"></i>保存
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 侧边栏切换
        document.getElementById('sidebar-toggle').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        });

        document.getElementById('sidebar-overlay').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        });

        // 侧边栏展开/折叠
        document.querySelectorAll('nav button').forEach(button => {
            button.addEventListener('click', function() {
                const dropdown = this.nextElementSibling;
                if (dropdown) {
                    dropdown.classList.toggle('hidden');
                    const icon = this.querySelector('.fa-chevron-down');
                    if (icon) {
                        icon.classList.toggle('rotate-180');
                    }
                }
            });
        });

        // 检查URL参数，判断是新建还是编辑
        const urlParams = new URLSearchParams(window.location.search);
        const customerId = urlParams.get('id');
        
        if (customerId) {
            // 编辑模式
            document.querySelector('h2').textContent = '编辑客户';
            // 这里可以添加加载客户数据的逻辑
        }
    </script>
</body>
</html>
