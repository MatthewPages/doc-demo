<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑文档 - eDOC 管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        dark: '#1e293b',
                        light: '#f8fafc'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .sidebar-active {
                @apply bg-primary text-white;
            }
            .sidebar-item {
                @apply flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 hover:bg-gray-100 dark:hover:bg-gray-700;
            }
            .sidebar-item.active {
                @apply bg-primary text-white;
            }
            .card {
                @apply bg-white dark:bg-gray-800 rounded-lg shadow-md p-4 transition-all duration-300 hover:shadow-lg;
            }
            .btn {
                @apply px-4 py-2 rounded-lg font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2;
            }
            .btn-primary {
                @apply bg-primary text-white hover:bg-primary/90 focus:ring-primary;
            }
            .btn-secondary {
                @apply bg-gray-200 text-gray-800 dark:bg-gray-700 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600 focus:ring-gray-400;
            }
            .btn-success {
                @apply bg-success text-white hover:bg-success/90 focus:ring-success;
            }
            .btn-warning {
                @apply bg-warning text-white hover:bg-warning/90 focus:ring-warning;
            }
            .btn-danger {
                @apply bg-danger text-white hover:bg-danger/90 focus:ring-danger;
            }
            .input {
                @apply w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent;
            }
            .form-label {
                @apply block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1;
            }
            .form-section {
                @apply mb-6;
            }
            .form-section-title {
                @apply text-lg font-semibold mb-4 pb-2 border-b border-gray-200 dark:border-gray-700;
            }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">
    <!-- 顶部导航栏 -->
    <header class="bg-white dark:bg-gray-800 shadow-sm z-10">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <button id="sidebar-toggle" class="text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 focus:outline-none lg:hidden">
                    <i class="fa fa-bars text-xl"></i>
                </button>
                <h1 class="text-xl font-bold text-primary">eDOC 管理系统</h1>
            </div>
            <div class="flex items-center gap-4">
                <div class="relative">
                    <input type="text" placeholder="搜索..." class="input pl-10 pr-4 py-2 text-sm w-64">
                    <i class="fa fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                </div>
                <div class="flex items-center gap-3">
                    <button class="text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 focus:outline-none relative">
                        <i class="fa fa-bell text-xl"></i>
                        <span class="absolute top-0 right-0 w-2 h-2 bg-danger rounded-full"></span>
                    </button>
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white">
                            <i class="fa fa-user"></i>
                        </div>
                        <span class="hidden md:inline">管理员</span>
                        <i class="fa fa-chevron-down text-xs text-gray-500 dark:text-gray-400"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <div class="flex flex-1 overflow-hidden">
        <!-- 侧边栏 -->
        <aside id="sidebar" class="w-64 bg-white dark:bg-gray-800 shadow-md transform -translate-x-full lg:translate-x-0 fixed lg:relative top-0 left-0 h-full z-20 transition-transform duration-300 ease-in-out">
            <div class="p-4 h-full flex flex-col">
                <div class="flex items-center gap-2 mb-8">
                    <div class="w-10 h-10 rounded-lg bg-primary flex items-center justify-center text-white">
                        <i class="fa fa-file-text-o text-xl"></i>
                    </div>
                    <h2 class="text-lg font-semibold">eDOC</h2>
                </div>
                <nav class="flex-1 space-y-1">
                    <a href="../index.html" class="sidebar-item">
                        <i class="fa fa-dashboard w-5 text-center"></i>
                        <span>管理概览</span>
                    </a>
                    <div class="space-y-1">
                        <button class="sidebar-item justify-between active">
                            <div class="flex items-center gap-3">
                                <i class="fa fa-folder-open w-5 text-center"></i>
                                <span>文档管理</span>
                            </div>
                            <i class="fa fa-chevron-down text-xs rotate-180"></i>
                        </button>
                        <div class="pl-8 space-y-1">
                            <a href="list.html" class="sidebar-item text-sm">
                                <span>文档列表</span>
                            </a>
                            <a href="add.html" class="sidebar-item text-sm">
                                <span>文档补录</span>
                            </a>
                            <a href="audit.html" class="sidebar-item text-sm">
                                <span>文档审核</span>
                            </a>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <button class="sidebar-item justify-between">
                            <div class="flex items-center gap-3">
                                <i class="fa fa-users w-5 text-center"></i>
                                <span>客户管理</span>
                            </div>
                            <i class="fa fa-chevron-down text-xs"></i>
                        </button>
                        <div class="pl-8 space-y-1 hidden">
                            <a href="../customers/list.html" class="sidebar-item text-sm">
                                <span>客户列表</span>
                            </a>
                            <a href="../customers/add.html" class="sidebar-item text-sm">
                                <span>新建客户</span>
                            </a>
                            <a href="../customers/logs.html" class="sidebar-item text-sm">
                                <span>客户操作日志</span>
                            </a>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <button class="sidebar-item justify-between">
                            <div class="flex items-center gap-3">
                                <i class="fa fa-plug w-5 text-center"></i>
                                <span>系统对接</span>
                            </div>
                            <i class="fa fa-chevron-down text-xs"></i>
                        </button>
                        <div class="pl-8 space-y-1 hidden">
                            <a href="../system/configuration.html" class="sidebar-item text-sm">
                                <span>对接系统配置</span>
                            </a>
                            <a href="../system/tasks.html" class="sidebar-item text-sm">
                                <span>同步任务管理</span>
                            </a>
                            <a href="../system/logs.html" class="sidebar-item text-sm">
                                <span>接口日志监控</span>
                            </a>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <button class="sidebar-item justify-between">
                            <div class="flex items-center gap-3">
                                <i class="fa fa-bar-chart w-5 text-center"></i>
                                <span>统计分析</span>
                            </div>
                            <i class="fa fa-chevron-down text-xs"></i>
                        </button>
                        <div class="pl-8 space-y-1 hidden">
                            <a href="../analytics/dashboard.html" class="sidebar-item text-sm">
                                <span>数据看板</span>
                            </a>
                            <a href="../analytics/reports.html" class="sidebar-item text-sm">
                                <span>报表中心</span>
                            </a>
                            <a href="../analytics/hotspots.html" class="sidebar-item text-sm">
                                <span>检索热点分析</span>
                            </a>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <button class="sidebar-item justify-between">
                            <div class="flex items-center gap-3">
                                <i class="fa fa-lock w-5 text-center"></i>
                                <span>权限管理</span>
                            </div>
                            <i class="fa fa-chevron-down text-xs"></i>
                        </button>
                        <div class="pl-8 space-y-1 hidden">
                            <a href="../permissions/roles.html" class="sidebar-item text-sm">
                                <span>角色管理</span>
                            </a>
                            <a href="../permissions/users.html" class="sidebar-item text-sm">
                                <span>用户管理</span>
                            </a>
                            <a href="../permissions/logs.html" class="sidebar-item text-sm">
                                <span>操作日志</span>
                            </a>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <button class="sidebar-item justify-between">
                            <div class="flex items-center gap-3">
                                <i class="fa fa-cog w-5 text-center"></i>
                                <span>系统设置</span>
                            </div>
                            <i class="fa fa-chevron-down text-xs"></i>
                        </button>
                        <div class="pl-8 space-y-1 hidden">
                            <a href="../settings/basic.html" class="sidebar-item text-sm">
                                <span>基础配置</span>
                            </a>
                            <a href="../settings/dictionary.html" class="sidebar-item text-sm">
                                <span>字典管理</span>
                            </a>
                        </div>
                    </div>
                </nav>
                <div class="mt-auto pt-4 border-t border-gray-200 dark:border-gray-700">
                    <a href="#" class="sidebar-item">
                        <i class="fa fa-question-circle w-5 text-center"></i>
                        <span>帮助中心</span>
                    </a>
                    <a href="#" class="sidebar-item">
                        <i class="fa fa-sign-out w-5 text-center"></i>
                        <span>退出登录</span>
                    </a>
                </div>
            </div>
        </aside>

        <!-- 遮罩层 -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-10 lg:hidden hidden"></div>

        <!-- 内容区 -->
        <main class="flex-1 overflow-y-auto p-4 lg:p-6">
            <div class="container mx-auto">
                <!-- 面包屑导航 -->
                <div class="flex items-center gap-2 mb-6 text-sm">
                    <a href="../index.html" class="text-gray-500 hover:text-primary">首页</a>
                    <i class="fa fa-chevron-right text-gray-400"></i>
                    <a href="list.html" class="text-gray-500 hover:text-primary">文档列表</a>
                    <i class="fa fa-chevron-right text-gray-400"></i>
                    <span class="text-gray-900 dark:text-gray-100">编辑文档</span>
                </div>

                <!-- 页面标题 -->
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold">编辑文档</h2>
                    <div class="flex items-center gap-3">
                        <button class="btn btn-secondary" onclick="window.history.back()">
                            <i class="fa fa-times mr-2"></i>取消
                        </button>
                        <button class="btn btn-primary">
                            <i class="fa fa-save mr-2"></i>保存
                        </button>
                    </div>
                </div>

                <!-- 文档编辑表单 -->
                <div class="card">
                    <!-- 基本信息 -->
                    <div class="form-section">
                        <h3 class="form-section-title">基本信息</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="form-label">文档名称</label>
                                <input type="text" value="销售合同-20230601.pdf" class="input" disabled>
                            </div>
                            <div>
                                <label class="form-label">文档类型 <span class="text-danger">*</span></label>
                                <select class="input">
                                    <option value="合同">合同</option>
                                    <option value="发票">发票</option>
                                    <option value="报表">报表</option>
                                    <option value="其他">其他</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">客户 <span class="text-danger">*</span></label>
                                <select class="input">
                                    <option value="客户A">客户A</option>
                                    <option value="客户B">客户B</option>
                                    <option value="客户C">客户C</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">订单号</label>
                                <input type="text" value="ORD-20230601-001" class="input">
                            </div>
                            <div>
                                <label class="form-label">产品代码</label>
                                <input type="text" value="PROD-2023-001" class="input">
                            </div>
                            <div>
                                <label class="form-label">项目编码</label>
                                <input type="text" value="PROJ-2023-001" class="input">
                            </div>
                            <div>
                                <label class="form-label">文档日期</label>
                                <input type="date" value="2023-06-01" class="input">
                            </div>
                            <div>
                                <label class="form-label">优先级</label>
                                <select class="input">
                                    <option value="普通">普通</option>
                                    <option value="重要">重要</option>
                                    <option value="紧急">紧急</option>
                                </select>
                            </div>
                            <div class="md:col-span-2">
                                <label class="form-label">状态 <span class="text-danger">*</span></label>
                                <select class="input">
                                    <option value="待审核">待审核</option>
                                    <option value="已通过">已通过</option>
                                    <option value="已拒绝">已拒绝</option>
                                </select>
                            </div>
                            <div class="md:col-span-2">
                                <label class="form-label">备注</label>
                                <textarea class="input" rows="3">2023年6月1日与客户A签订的销售合同，包含产品明细、价格、交付条款等内容。</textarea>
                            </div>
                        </div>
                    </div>

                    <!-- 元数据 -->
                    <div class="form-section">
                        <h3 class="form-section-title">元数据</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="form-label">来源系统</label>
                                <select class="input">
                                    <option value="手动上传">手动上传</option>
                                    <option value="CRM系统">CRM系统</option>
                                    <option value="ERP系统">ERP系统</option>
                                    <option value="其他">其他</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">文件大小</label>
                                <input type="text" value="2.4 MB" class="input" disabled>
                            </div>
                            <div>
                                <label class="form-label">上传时间</label>
                                <input type="text" value="2023-06-01 10:30:00" class="input" disabled>
                            </div>
                            <div>
                                <label class="form-label">上传人</label>
                                <input type="text" value="管理员" class="input" disabled>
                            </div>
                            <div>
                                <label class="form-label">版本号</label>
                                <input type="text" value="v1.0" class="input" disabled>
                            </div>
                            <div>
                                <label class="form-label">文件格式</label>
                                <input type="text" value="PDF" class="input" disabled>
                            </div>
                        </div>
                    </div>

                    <!-- 权限配置 -->
                    <div class="form-section">
                        <h3 class="form-section-title">权限配置</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="form-label">客户访问权限</label>
                                <div class="space-y-2">
                                    <label class="flex items-center gap-2">
                                        <input type="checkbox" class="rounded border-gray-300 text-primary focus:ring-primary" checked>
                                        <span class="text-sm">允许客户查看此文档</span>
                                    </label>
                                    <label class="flex items-center gap-2">
                                        <input type="checkbox" class="rounded border-gray-300 text-primary focus:ring-primary" checked>
                                        <span class="text-sm">允许客户下载此文档</span>
                                    </label>
                                    <label class="flex items-center gap-2">
                                        <input type="checkbox" class="rounded border-gray-300 text-primary focus:ring-primary">
                                        <span class="text-sm">允许客户分享此文档</span>
                                    </label>
                                </div>
                            </div>
                            <div>
                                <label class="form-label">有效期设置</label>
                                <div class="flex items-center gap-2 mt-2">
                                    <input type="date" class="input w-48" placeholder="开始日期">
                                    <span class="text-gray-500">至</span>
                                    <input type="date" class="input w-48" placeholder="结束日期">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 上传新版本 -->
                    <div class="form-section">
                        <h3 class="form-section-title">上传新版本</h3>
                        <div class="border border-gray-200 dark:border-gray-700 rounded-lg p-6 bg-gray-50 dark:bg-gray-900/50">
                            <div class="mb-4">
                                <label class="form-label">选择新版本文件 <span class="text-danger">*</span></label>
                                <div class="relative">
                                    <input type="file" class="input" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.jpg,.png,.gif">
                                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">支持格式：PDF, DOC, DOCX, XLS, XLSX, PPT, PPTX, TXT, JPG, PNG, GIF</p>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">版本说明</label>
                                <textarea class="input" rows="3" placeholder="请输入本次更新的版本说明..."></textarea>
                            </div>
                            <div class="flex items-center gap-3">
                                <button type="button" class="btn btn-success">
                                    <i class="fa fa-upload mr-2"></i>上传新版本
                                </button>
                                <span class="text-sm text-gray-500 dark:text-gray-400">
                                    当前版本：v1.0 (2023-06-01 10:30:00)
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 侧边栏切换
        document.getElementById('sidebar-toggle').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        });

        document.getElementById('sidebar-overlay').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        });

        // 侧边栏展开/折叠
        document.querySelectorAll('nav button').forEach(button => {
            button.addEventListener('click', function() {
                const dropdown = this.nextElementSibling;
                if (dropdown) {
                    dropdown.classList.toggle('hidden');
                    const icon = this.querySelector('.fa-chevron-down');
                    if (icon) {
                        icon.classList.toggle('rotate-180');
                    }
                }
            });
        });
    </script>
</body>
</html>
